name: River Runner EE verification

on:
  push:
    branches: [main, exploit-edition, 'exploit/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source for reproducible review
        run: |
          git archive --format=zip HEAD -o source-checkout.zip
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: |
            source-checkout.zip
            SOURCE_COMMIT.txt
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine and Android tests, installable debug APK
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Record APK integrity and signing identity
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk river-runner-ee-debug.apk
          sha256sum river-runner-ee-debug.apk > SHA256SUMS.txt
          build_tools=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "${build_tools}/apksigner" verify --print-certs river-runner-ee-debug.apk > APK_CERTIFICATE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: river-runner-ee-debug
          path: |
            river-runner-ee-debug.apk
            SHA256SUMS.txt
            APK_CERTIFICATE.txt
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            engine/build/test-results/
            engine/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14
